org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Compilacao incremental do Kotlin desligada de proposito.
#
# Com ela ligada, os modulos Kotlin dos plugins (url_launcher_android,
# shared_preferences_android) falhavam no Windows com
# "Could not close incremental caches ... class-fq-name-to-source.tab":
# a protecao em tempo real do antivirus trava esses arquivos de cache no
# momento em que o compilador tenta fecha-los. O sintoma seguinte era
# enganoso - "package io.flutter.plugins.urllauncher does not exist" no
# GeneratedPluginRegistrant.java - porque sem as classes dos plugins o
# javac nao encontrava os pacotes.
#
# Custo: builds um pouco mais lentos. Beneficio: build confiavel.
kotlin.incremental=false
